name: build
on:
  workflow_dispatch:
    inputs:
      tag:
        required: true
        default: "test"
  push:
    paths-ignore: ["**.md"]
    branches: [master, build-test]
  pull_request:
    paths-ignore: ["**.md"]
    branches: [master]

env:
  ZIGBUILD_GLIBC: "2.28"
jobs:
  build:
    runs-on: >-
      ${{  
        contains(matrix.target, 'apple') && 'macos-latest' ||
        contains(matrix.target, 'msvc') && 'windows-latest' ||
        'ubuntu-22.04'
      }}
    strategy:
      matrix:
        target:
          # cross
          - x86_64-unknown-linux-gnu
          - x86_64-unknown-linux-musl
          - x86_64-pc-windows-gnu
          - x86_64-linux-android
          - aarch64-unknown-linux-gnu
          - aarch64-unknown-linux-musl
          - aarch64-linux-android
          - arm-unknown-linux-gnueabi
          - arm-unknown-linux-gnueabihf
          - arm-unknown-linux-musleabi
          - arm-unknown-linux-musleabihf
          - armv7-unknown-linux-gnueabi
          - armv7-unknown-linux-gnueabihf
          - armv7-unknown-linux-musleabi
          - armv7-unknown-linux-musleabihf
          # mips
          - mips-unknown-linux-gnu
          - mips-unknown-linux-musl
          - mipsel-unknown-linux-gnu
          - mipsel-unknown-linux-musl
          - mips64-unknown-linux-gnuabi64
          - mips64-unknown-linux-muslabi64
          - mips64el-unknown-linux-gnuabi64
          - mips64el-unknown-linux-muslabi64
          # windows
          - x86_64-pc-windows-msvc
          - aarch64-pc-windows-msvc
          # apple
          - x86_64-apple-darwin
          - aarch64-apple-darwin
          - aarch64-apple-ios
    steps:
      - uses: actions/checkout@v6
      - run: mkdir -p out/${{ matrix.target }}
      # cross
      - name: build cross
        if: |
          !contains(matrix.target, 'apple') &&
          !contains(matrix.target, 'msvc')
        uses: ./.github/actions/build/cross
        with:
          mode: cross
          target: ${{ matrix.target }}
          outdir: out/${{ matrix.target }}
      # windows
      - name: build windows
        if: contains(matrix.target, 'msvc')
        uses: ./.github/actions/build/windows
        with:
          target: ${{ matrix.target }}
          outdir: out/${{ matrix.target }}
      # # apple
      - name: build apple
        if: contains(matrix.target, 'apple')
        uses: ./.github/actions/build/apple
        with:
          target: ${{ matrix.target }}
          outdir: out/${{ matrix.target }}
      # finalize
      - name: upload binary
        uses: actions/upload-artifact@v6
        with:
          name: realm-${{ matrix.target }}
          path: out/${{ matrix.target }}/realm
      - name: upload binary (slim)
        uses: actions/upload-artifact@v6
        with:
          name: realm-slim-${{ matrix.target }}
          path: out/${{ matrix.target }}/realm-slim

  build-glibc:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - arm-unknown-linux-gnueabi
          - arm-unknown-linux-gnueabihf
          - armv7-unknown-linux-gnueabi
          - armv7-unknown-linux-gnueabihf
          - mips-unknown-linux-gnu
          - mipsel-unknown-linux-gnu
          - mips64-unknown-linux-gnuabi64
          - mips64el-unknown-linux-gnuabi64
    steps:
      - uses: actions/checkout@v6
      - run: mkdir -p out/${{ matrix.target }}-glibc${{ env.ZIGBUILD_GLIBC }}
      - name: try build cross-zigbuild-glibc
        id: try-zigbuild
        continue-on-error: true # may fail on some targets due to compiler-rt issues
        uses: ./.github/actions/build/cross
        with:
          mode: zigbuild
          zigbuild-glibc: ${{ env.ZIGBUILD_GLIBC }}
          target: ${{ matrix.target }}
          outdir: out/${{ matrix.target }}-glibc${{ env.ZIGBUILD_GLIBC }}
      # finalize
      - name: upload binary (cross-zigbuild-glibc)
        if: ${{ steps.try-zigbuild.outcome == 'success' }}
        uses: actions/upload-artifact@v6
        with:
          name: realm-${{ matrix.target }}-glibc${{ env.ZIGBUILD_GLIBC }}
          path: out/${{ matrix.target }}-glibc${{ env.ZIGBUILD_GLIBC }}/realm
      - name: upload binary (cross-zigbuild-glibc-slim)
        if: ${{ steps.try-zigbuild.outcome == 'success' }}
        uses: actions/upload-artifact@v6
        with:
          name: realm-slim-${{ matrix.target }}-glibc${{ env.ZIGBUILD_GLIBC }}
          path: out/${{ matrix.target }}-glibc${{ env.ZIGBUILD_GLIBC }}/realm-slim
